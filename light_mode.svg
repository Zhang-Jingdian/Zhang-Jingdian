<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <defs>
    <style>
      .bg { fill: #f6f8fa; }
      .text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji'; }
      .title { font-size: 22px; font-weight: bold; fill: #24292e; }
      .subtitle { font-size: 16px; fill: #586069; }
      .header { font-size: 16px; font-weight: 600; fill: #d73a49; }
      .item { font-size: 14px; fill: #24292e; }
      .stat-label { font-size: 12px; fill: #d73a49; }
      .stat-value { font-size: 12px; font-weight: bold; fill: #0366d6; }
      .chart-title { font-size: 14px; font-weight: 600; fill: #d73a49; }
      .contrib-cell { stroke: #e1e4e8; stroke-width: 1; }
      .contrib-cell[data-level='0'] { fill: #ebedf0; }
      .contrib-cell[data-level='1'] { fill: #9be9a8; }
      .contrib-cell[data-level='2'] { fill: #40c463; }
      .contrib-cell[data-level='3'] { fill: #30a14e; }
      .contrib-cell[data-level='4'] { fill: #216e39; }
      #ascii-art tspan { font-family: 'Courier New', monospace; font-size: 10px; fill: #586069; }
    </style>
  </defs>

  <rect width="100%" height="100%" rx="10" class="bg"/>

  <!-- Header -->
  <text x="50%" y="40" text-anchor="middle" class="text title">Hello, I'm Jingdian Zhang</text>
  <text x="50%" y="65" text-anchor="middle" class="text subtitle">CS @ ZJU | Full Stack Developer | Tech Enthusiast</text>

  <!-- Main Grid -->
  <g transform="translate(30, 100)">
    <!-- Column 1: Languages -->
    <text x="0" y="0" class="text header">Languages</text>
    <text x="0" y="25" class="text item">Python</text>
    <text x="0" y="45" class="text item">TypeScript</text>
    <text x="0" y="65" class="text item">Go</text>
    <text x="0" y="85" class="text item">SQL</text>

    <!-- Column 2: Tools & Tech -->
    <text x="180" y="0" class="text header">Tools &amp; Tech</text>
    <text x="180" y="25" class="text item">Docker</text>
    <text x="180" y="45" class="text item">Kubernetes</text>
    <text x="180" y="65" class="text item">React</text>
    <text x="180" y="85" class="text item">Vue</text>

    <!-- Column 3: Interests -->
    <text x="360" y="0" class="text header">Interests</text>
    <text x="360" y="25" class="text item">Algorithms</text>
    <text x="360" y="45" class="text item">Distributed Systems</text>
    <text x="360" y="65" class="text item">Machine Learning</text>
    <text x="360" y="85" class="text item">Data Science</text>
  </g>

  <!-- Contribution Graph -->
  <g transform="translate(30, 220)">
    <text x="250" y="-10" text-anchor="middle" class="text chart-title">Contribution Graph (Last 365 Days)</text>
    <g id="contrib-graph">
      <!-- Contribution rects will be injected here -->
    </g>
  </g>

  <!-- ASCII Art -->
  <g id="ascii-art" transform="translate(560, 95)">
      <!-- ASCII art tspans will be injected here -->
  </g>

  <!-- Footer Stats -->
  <g transform="translate(30, 395)">
    <text class="text">
      <tspan class="stat-label">Commits (this year):</tspan>
      <tspan id="commit_data" class="stat-value" dx="5">0</tspan>
      <tspan class="stat-label" dx="20">Stars:</tspan>
      <tspan id="star_data" class="stat-value" dx="5">0</tspan>
      <tspan class="stat-label" dx="20">Followers:</tspan>
      <tspan id="follower_data" class="stat-value" dx="5">0</tspan>
    </text>
  </g>

</svg> 