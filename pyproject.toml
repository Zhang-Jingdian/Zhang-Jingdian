[tool.basedpyright]
# 配置 basedpyright 类型检查器
typeCheckingMode = "standard"

# 减少对索引问题的严格检查
reportIndexIssue = "warning"

# 忽略一些常见的误报
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"

# 允许未类型化的装饰器
reportUntypedFunctionDecorator = "none"

# 项目根目录
pythonVersion = "3.9" 