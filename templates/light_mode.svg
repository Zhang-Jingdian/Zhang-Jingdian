        <tspan x="15" y="105.0"><tspan class="key">Jingdian Zhang</tspan><tspan class="cc">@</tspan><tspan class="key">GitHub</tspan></tspan>
        <tspan x="15" y="125.0">---------------------------------------------</tspan>
        <tspan x="15" y="150.0"><tspan class="key">School</tspan><tspan class="cc">: </tspan><tspan class="value">Zhejiang University</tspan></tspan>
        <tspan x="15" y="170.0"><tspan class="key">Major</tspan><tspan class="cc">: </tspan><tspan class="value">Computer Science</tspan></tspan>
        <tspan x="15" y="190.0"><tspan class="key">Languages</tspan><tspan class="cc">: </tspan><tspan class="value">Python, TypeScript, Go, SQL</tspan></tspan>
        <tspan x="15" y="210.0"><tspan class="key">Tools &amp; Tech</tspan><tspan class="cc">: </tspan><tspan class="value">Docker, Kubernetes, React, Vue</tspan></tspan>
        <tspan x="15" y="230.0"><tspan class="key">Interests</tspan><tspan class="cc">: </tspan><tspan class="value">Distributed Systems, ML</tspan></tspan>
        <tspan x="15" y="250.0">---<tspan class="cc">[</tspan> <tspan class="key">GitHub Stats</tspan> <tspan class="cc">]</tspan>-----------------------------</tspan>
        <tspan x="15" y="275.0"><tspan class="key">Commits (this year)</tspan><tspan class="cc">: </tspan><tspan id="commit_data" class="value">2,393</tspan></tspan>
        <tspan x="15" y="295.0"><tspan class="key">Stars</tspan><tspan class="cc">: </tspan><tspan id="star_data" class="value">0</tspan></tspan>
        <tspan x="15" y="315.0"><tspan class="key">Followers</tspan><tspan class="cc">: </tspan><tspan id="follower_data" class="value">1</tspan></tspan>
    </text>
</g>
</svg>
