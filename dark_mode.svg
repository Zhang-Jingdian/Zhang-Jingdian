<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="280" viewBox="0 0 700 280">
  <defs>
    <style>
      .bg { fill: #202020; }
      .text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji'; }
      .title { font-size: 22px; font-weight: bold; fill: #a5d6ff; }
      .subtitle { font-size: 16px; fill: #c9d1d9; }
      .header { font-size: 16px; font-weight: 600; fill: #ffa657; }
      .item { font-size: 14px; fill: #e0e0e0; }
      .stat-label { font-size: 12px; fill: #ffa657; }
      .stat-value { font-size: 12px; font-weight: bold; fill: #a5d6ff; }
      #ascii-art tspan { font-family: 'Courier New', monospace; font-size: 10px; fill: #c9d1d9; line-height: 1.2; }
    </style>
  </defs>

  <rect width="100%" height="100%" rx="10" class="bg"/>

  <!-- ASCII Art Left Column -->
  <g id="ascii-art" transform="translate(20, 40)">
    <tspan x="0" dy="1.2em">@@@@@@@@@%####%%@@@@@@@@@</tspan>
<tspan x="0" dy="1.2em">@@@@@#+=---------=*%@@@@@</tspan>
<tspan x="0" dy="1.2em">@@@#+-----:::::-----+%@@@</tspan>
<tspan x="0" dy="1.2em">@@%+++=+++*+=+*+++=++*%%@</tspan>
<tspan x="0" dy="1.2em">@%*::-+*=:*%+%*:=*+:::*%@</tspan>
<tspan x="0" dy="1.2em">@+#-:-#%*:#=.=#:*%#-:-#*@</tspan>
<tspan x="0" dy="1.2em">@-**===++**:::**++===**=@</tspan>
<tspan x="0" dy="1.2em">@=--=*=---:::::---=*=--+@</tspan>
<tspan x="0" dy="1.2em">@#--:*%%#***+***#%%=:--%@</tspan>
<tspan x="0" dy="1.2em">@@*--:=*%#****#%#*-:--#@@</tspan>
<tspan x="0" dy="1.2em">@@@%+-::---------::-*%@@@</tspan>
<tspan x="0" dy="1.2em">@@@@@@#+=------==*#@@@@@@</tspan>
<tspan x="0" dy="1.2em">@@@@@@@@@@@@%@@@@@@@@@@@@</tspan>
</g>

  <!-- Right Column -->
  <g transform="translate(240, 40)">
    <!-- Header -->
    <text x="0" y="0" text-anchor="start" class="text title">Hello, I'm Jingdian Zhang</text>
    <text x="0" y="25" text-anchor="start" class="text subtitle">CS @ ZJU | Full Stack Developer | Tech Enthusiast</text>

    <!-- Main Grid -->
    <g transform="translate(0, 65)">
      <!-- Column 1: Languages -->
      <text x="0" y="0" class="text header">Languages</text>
      <text x="0" y="25" class="text item">Python</text>
      <text x="0" y="45" class="text item">TypeScript</text>
      <text x="0" y="65" class="text item">Go</text>
      <text x="0" y="85" class="text item">SQL</text>

      <!-- Column 2: Tools & Tech -->
      <text x="150" y="0" class="text header">Tools &amp; Tech</text>
      <text x="150" y="25" class="text item">Docker</text>
      <text x="150" y="45" class="text item">Kubernetes</text>
      <text x="150" y="65" class="text item">React</text>
      <text x="150" y="85" class="text item">Vue</text>

      <!-- Column 3: Interests -->
      <text x="300" y="0" class="text header">Interests</text>
      <text x="300" y="25" class="text item">Algorithms</text>
      <text x="300" y="45" class="text item">Distributed Systems</text>
      <text x="300" y="65" class="text item">Machine Learning</text>
      <text x="300" y="85" class="text item">Data Science</text>
    </g>

    <!-- Footer Stats -->
    <g transform="translate(0, 200)">
      <text class="text">
        <tspan class="stat-label">Commits (this year):</tspan>
        <tspan id="commit_data" class="stat-value" dx="5">2,393</tspan>
        <tspan class="stat-label" dx="20">Stars:</tspan>
        <tspan id="star_data" class="stat-value" dx="5">0</tspan>
        <tspan class="stat-label" dx="20">Followers:</tspan>
        <tspan id="follower_data" class="stat-value" dx="5">1</tspan>
      </text>
    </g>
  </g>
</svg>
